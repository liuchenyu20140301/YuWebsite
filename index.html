<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>YuWebsite 社区</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f2f5f7;
        }
        .hidden {
            display: none !important;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            margin-right: 6px;
            margin-top: 4px;
        }
        button.danger {
            background: #ef4444;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
            vertical-align: middle;
        }
        .user-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .badge {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            margin-left: 8px;
        }
        .user { background: #6b7280; }
        .vip { background: #f59e0b; }
        .admin { background: #10b981; }
        .owner { background: #8b5cf6; }
        .tip {
            color: #666;
            margin: 10px 0;
        }
        .post-form {
            display: none;
        }
        .del-btn {
            float: right;
            transform: translateY(-6px);
        }
        .loading {
            text-align: center;
            color: #3b82f6;
            margin: 20px 0;
            font-size: 16px;
        }
        .like {
            color: #f43f5e;
            cursor: pointer;
            margin-right: 10px;
        }
        .comment {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        .reply {
            padding-left: 30px;
            font-size: 14px;
            color: #555;
        }
        .pinned {
            border: 1px solid #8b5cf6;
            background: #faf5ff;
        }
        .global-pin {
            background: #fff7e6;
            border: 1px solid #f59e0b;
        }
        .pill {
            background: #eee;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .msg-me {
            text-align: right;
            background: #dbeafe;
            padding: 6px 10px;
            border-radius: 10px;
            margin: 4px 0;
        }
        .msg-other {
            text-align: left;
            background: #f3f4f6;
            padding: 6px 10px;
            border-radius: 10px;
            margin: 4px 0;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .modal-content {
            background: white;
            width: 90%; max-width: 500px;
            padding: 20px; border-radius: 12px;
        }
        .close {
            float: right;
            cursor: pointer;
            font-size: 20px;
        }
        .tab-btn {
            padding: 6px 12px;
            background: #eee;
            border: none;
            color: #333;
            margin-right: 4px;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
        }
        #msgCount {
            background: red;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<header>
    <h1>YuWebsite 社区</h1>
    <div id="userInfo">未登录</div>
</header>

<div class="card" id="loginBox">
    <input id="username" placeholder="用户名（不可重复）">
    <input id="password" placeholder="密码" type="password">
    <input id="avatarInput" placeholder="头像 URL">
    <button onclick="register()">注册</button>
    <button onclick="login()">登录</button>
</div>

<div class="card post-form" id="postBox">
    <input id="postTitle" placeholder="帖子标题">
    <textarea id="postContent" placeholder="帖子内容"></textarea>
    <button onclick="sendPost()">发布帖子</button>
    <button onclick="showModal('announceModal')">📢 推送</button>
    <button onclick="openMessages()">📥 消息 <span id="msgCount">0</span></button>
</div>

<div class="tip" id="tip"></div>
<div class="loading" id="loading">正在加载...</div>
<div id="postList"></div>

<!-- 消息页面 -->
<div id="messagesPage" class="hidden">
    <div class="card">
        <button onclick="closeMessages()">返回首页</button>
        <h2>消息中心</h2>
        <div style="margin:10px 0">
            <button class="tab-btn active" onclick="switchTab('private')">私信</button>
            <button class="tab-btn" onclick="switchTab('apply')">封禁申请</button>
            <button class="tab-btn" onclick="switchTab('system')">系统通知</button>
        </div>

        <div id="tab_private">
            <div id="messageList"></div>
            <input id="msgTo" placeholder="发给谁">
            <input id="msgContent" placeholder="输入消息">
            <button onclick="sendMessageUI()">发送</button>
        </div>

        <div id="tab_apply" class="hidden">
            <div id="applyList"></div>
        </div>

        <div id="tab_system" class="hidden">
            <div id="systemList"></div>
        </div>
    </div>
</div>

<!-- UI 弹窗 -->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>

<script>
const BIN_ID = "6a198c4521f9ee59d299a763";
const MASTER_KEY = "$2a$10$B3g5L3BArDbvMO.hIsRpIeVyd5Vd3o/4vXqKQRtRIv4l.ohiVPbMe";
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

let users = [];
let posts = [];
let comments = [];
let likes = [];
let follows = [];
let messages = [];
let bans = [];
let banApplies = [];
let currentUser = localStorage.getItem("currentUser") || null;
let currentTab = "private";

window.onload = async () => {
    await loadData();
    loading.style.display = "none";
    render();
};

async function loadData() {
    try {
        let res = await fetch(API_URL, { headers: { "X-Master-Key": MASTER_KEY } });
        let json = await res.json();
        let d = json.record;
        users = d.users || [];
        posts = d.posts || [];
        comments = d.comments || [];
        likes = d.likes || [];
        follows = d.follows || [];
        messages = d.messages || [];
        bans = d.bans || [];
        banApplies = d.banApplies || [];
    } catch (e) {
        let local = JSON.parse(localStorage.getItem("data")) || {
            users:[],posts:[],comments:[],likes:[],follows:[],messages:[],bans:[],banApplies:[]
        };
        users = local.users;
        posts = local.posts;
        comments = local.comments;
        likes = local.likes;
        follows = local.follows;
        messages = local.messages;
        bans = local.bans;
        banApplies = local.banApplies;
    }
}

async function save() {
    let data = { users, posts, comments, likes, follows, messages, bans, banApplies };
    localStorage.setItem("data", JSON.stringify(data));
    await fetch(API_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
        body: JSON.stringify(data)
    });
    render();
}

function toast(text) {
    document.getElementById("modalBody").innerHTML = `<p>${text}</p>`;
    showModal("modal");
    setTimeout(closeModal, 1500);
}

function showModal(id) {
    document.getElementById(id).classList.remove("hidden");
}
function closeModal() {
    document.getElementById("modal").classList.add("hidden");
}

function openMessages() {
    document.getElementById("postList").classList.add("hidden");
    document.getElementById("messagesPage").classList.remove("hidden");
    renderMessages();
}
function closeMessages() {
    document.getElementById("messagesPage").classList.add("hidden");
    document.getElementById("postList").classList.remove("hidden");
}
function switchTab(t) {
    currentTab = t;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-btn").forEach(b => {
        if (b.innerText.includes(t == "private" ? "私信" : t == "apply" ? "封禁申请" : "系统")) b.classList.add("active");
    });
    document.getElementById("tab_private").classList.add("hidden");
    document.getElementById("tab_apply").classList.add("hidden");
    document.getElementById("tab_system").classList.add("hidden");
    document.getElementById("tab_"+t).classList.remove("hidden");
    renderMessages();
}

// ====================== 登录注册 ======================
function register() {
    let u = username.value.trim();
    let p = password.value.trim();
    let a = avatarInput.value.trim();
    if (!u || !p) return toast("请输入账号密码");
    if (users.find(x => x.user === u)) return toast("用户名已存在");
    if (bans.find(x => x.user === u)) return toast("该账号已被封禁");
    users.push({ user: u, pwd: p, avatar: a, role: u === "liuchenyu" ? "owner" : "user" });
    save();
    toast("注册成功");
}
function login() {
    let u = username.value.trim();
    let p = password.value.trim();
    if (bans.find(x => x.user === u)) return toast("已被封禁");
    let user = users.find(x => x.user === u && x.pwd === p);
    if (!user) return toast("账号或密码错误");
    currentUser = u;
    localStorage.setItem("currentUser", u);
    render();
}
function logout() {
    currentUser = null;
    localStorage.removeItem("currentUser");
    render();
}

// ====================== 帖子 ======================
function sendPost() {
    if (!currentUser) return;
    let t = postTitle.value.trim();
    let c = postContent.value.trim();
    if (!t || !c) return toast("请填写完整");
    posts.unshift({ id: Date.now(), user: currentUser, title: t, content: c, time: new Date().toLocaleString(), pin: 0 });
    postTitle.value = "";
    postContent.value = "";
    save();
}
function deletePost(id) {
    let p = posts.find(x => x.id === id);
    let me = users.find(x => x.user === currentUser);
    if (!me) return;
    let allow = me.role === "owner" || me.role === "admin" || p.user === currentUser;
    if (!allow) return toast("无权限");
    posts = posts.filter(x => x.id !== id);
    save();
}
function pinPost(id) {
    posts.forEach(p => p.pin = 0);
    posts.find(p => p.id === id).pin = 1;
    save();
}

// ====================== 点赞 / 取消点赞 ======================
function likePost(pid) {
    if (!currentUser) return;
    let idx = likes.findIndex(x => x.pid === pid && x.user === currentUser);
    if (idx >= 0) {
        likes.splice(idx, 1);
        toast("已取消点赞");
    } else {
        likes.push({ pid, user: currentUser });
        toast("点赞成功");
    }
    save();
}

// ====================== 评论 / 回复 / 删除 ======================
function addComment(pid) {
    if (!currentUser) return;
    let content = prompt("输入评论");
    if (!content) return;
    comments.push({
        id: Date.now(), pid, user: currentUser, content,
        time: new Date().toLocaleString(), pin: 0
    });
    save();
}
function replyComment(cid) {
    if (!currentUser) return;
    let content = prompt("回复");
    if (!content) return;
    comments.push({
        id: Date.now(), pid: 0, replyTo: cid, user: currentUser, content,
        time: new Date().toLocaleString()
    });
    save();
}
function deleteComment(id) {
    let c = comments.find(x => x.id === id);
    let me = users.find(x => x.user === currentUser);
    if (!me) return;
    let allow = me.role === "owner" || me.role === "admin" || c.user === currentUser;
    if (!allow) return toast("无权限");
    comments = comments.filter(x => x.id !== id);
    save();
}
function pinComment(id) {
    comments.find(c => c.id === id).pin = 1;
    save();
}

// ====================== 关注 / 取消关注 ======================
function follow(user) {
    if (user === currentUser) return;
    let idx = follows.findIndex(x => x.from === currentUser && x.to === user);
    if (idx >= 0) {
        follows.splice(idx, 1);
        toast("已取消关注");
    } else {
        follows.push({ from: currentUser, to: user });
        toast("关注成功");
    }
    save();
}

// ====================== 私信 ======================
function sendMessageUI() {
    let to = document.getElementById("msgTo").value.trim();
    let content = document.getElementById("msgContent").value.trim();
    if (!to || !content) return toast("填写完整");
    messages.push({
        from: currentUser, to, content, time: new Date().toLocaleString(),
        type: "private", read: false
    });
    document.getElementById("msgContent").value = "";
    save();
}
function renderMessages() {
    let privateList = document.getElementById("messageList");
    let applyList = document.getElementById("applyList");
    let systemList = document.getElementById("systemList");
    privateList.innerHTML = "";
    applyList.innerHTML = "";
    systemList.innerHTML = "";

    messages.filter(m => m.type === "private" && (m.from === currentUser || m.to === currentUser)).forEach(m => {
        privateList.innerHTML += `<div class="${m.from === currentUser ? 'msg-me' : 'msg-other'}">
            ${m.from} → ${m.to}<br>${m.content}<br><small>${m.time}</small></div>`;
        m.read = true;
    });

    banApplies.forEach(a => {
        applyList.innerHTML += `<div class="card"><p>${a.admin} 申请封禁 ${a.target}</p>
        <button onclick="allowBan(${a.id})">通过</button></div>`;
    });

    messages.filter(m => m.type === "system").forEach(m => {
        systemList.innerHTML += `<div class="card">${m.content}<br><small>${m.time}</small></div>`;
    });
    save();
}

// ====================== 封禁系统 ======================
function applyBan(target) {
    let me = users.find(x => x.user === currentUser);
    if (!me) return;
    if (me.role !== "admin" && me.role !== "owner") return toast("无权限");
    if (me.role === "owner") {
        bans.push({ user: target, time: new Date().toLocaleString() });
        toast("已直接封禁");
        save();
        return;
    }
    banApplies.push({
        id: Date.now(), admin: currentUser, target: target,
        time: new Date().toLocaleString()
    });
    toast("已向管理者提交封禁申请");
    save();
}
function allowBan(id) {
    let me = users.find(x => x.user === currentUser);
    if (me.role !== "owner") return toast("仅管理者可通过");
    let a = banApplies.find(x => x.id === id);
    bans.push({ user: a.target, time: new Date().toLocaleString() });
    banApplies = banApplies.filter(x => x.id !== id);
    toast("已封禁");
    save();
}

// ====================== 渲染 ======================
function render() {
    let me = users.find(x => x.user === currentUser);
    let unread = messages.filter(m => m.to === currentUser && !m.read).length;
    document.getElementById("msgCount").innerText = unread;

    userInfo.innerHTML = currentUser
        ? `<div class="user-row">
            <img class="avatar" src="${me?.avatar||'https://picsum.photos/64/64'}">
            ${currentUser} <span class="badge ${me.role}">${me.role}</span>
            <button onclick="logout()">退出</button>
        </div>`
        : "未登录";

    loginBox.style.display = currentUser ? "none" : "block";
    postBox.style.display = currentUser ? "block" : "none";

    postList.innerHTML = "";
    posts.sort((a, b) => b.pin - a.pin).forEach(p => {
        let myLike = likes.find(x => x.pid === p.id && x.user === currentUser);
        let cmtList = comments.filter(x => x.pid === p.id);
        let isFollowed = follows.find(x => x.from === currentUser && x.to === p.user);

        let pinBtn = (me?.role === "owner" || me?.role === "admin")
            ? `<button onclick="pinPost(${p.id})">置顶</button>` : "";

        let banBtn = (me?.role === "admin" || me?.role === "owner")
            ? `<button class="danger" onclick="applyBan('${p.user}')">封禁</button>` : "";

        postList.innerHTML += `
        <div class="card ${p.pin ? 'global-pin' : ''}">
            <button class="del-btn" onclick="deletePost(${p.id})">删除</button>
            ${pinBtn} ${banBtn}
            <div class="user-row">
                <img class="avatar" src="${users.find(u=>u.user===p.user)?.avatar||'https://picsum.photos/64/64'}">
                <div>
                    <b>${p.user}</b>
                    <span class="badge ${users.find(u=>u.user===p.user)?.role||'user'}">${users.find(u=>u.user===p.user)?.role||'user'}</span>
                    <div style="font-size:12px;color:#888">${p.time}</div>
                </div>
                <button class="pill" onclick="follow('${p.user}')">
                    ${isFollowed ? "取消关注" : "关注"}
                </button>
            </div>
            <h3>${p.title}</h3>
            <p>${p.content}</p>
            <div style="margin-top:10px">
                <span class="like" onclick="likePost(${p.id})">
                    ❤️ ${likes.filter(x=>x.pid===p.id).length}
                </span>
                <button onclick="addComment(${p.id})">评论</button>
            </div>
            <div class="comments">
                ${cmtList.sort((a,b)=>b.pin-a.pin).map(c => `
                <div class="comment ${c.pin?'pinned':''}">
                    <b>${c.user}</b> ${c.pin?'[置顶]':''}<br>${c.content}<br>
                    <small>${c.time}</small>
                    <button onclick="replyComment(${c.id})">回复</button>
                    <button class="danger" onclick="deleteComment(${c.id})">删评论</button>
                    ${me?.role==='owner'||me?.role==='admin'?`<button onclick="pinComment(${c.id})">顶置</button>`:''}
                </div>
                <div class="reply">
                    ${comments.filter(r=>r.replyTo===c.id).map(r=>`
                    <div><b>${r.user}</b>: ${r.content}</div>
                    `).join('')}
                </div>
                `).join('')}
            </div>
        </div>`;
    });
}
</script>
</body>
</html>
