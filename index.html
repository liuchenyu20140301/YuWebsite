<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>YuWebsite 社区</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f2f5f7;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            margin-right: 6px;
            margin-top: 4px;
        }
        button.danger {
            background: #ef4444;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
            vertical-align: middle;
        }
        .user-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .badge {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            margin-left: 8px;
        }
        .user { background: #6b7280; }
        .vip { background: #f59e0b; }
        .admin { background: #10b981; }
        .owner { background: #8b5cf6; }
        .tip {
            color: #666;
            margin: 10px 0;
        }
        .post-form {
            display: none;
        }
        .del-btn {
            float: right;
            transform: translateY(-6px);
        }
        .loading {
            color: #3b82f6;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<header>
    <h1>YuWebsite 社区</h1>
    <div id="userInfo">未登录</div>
</header>

<div class="card" id="loginBox">
    <input id="username" placeholder="用户名（不可重复）">
    <input id="password" placeholder="密码" type="password">
    <input id="avatarInput" placeholder="头像 URL" type="url">
    <button onclick="register()">注册</button>
    <button onclick="login()">登录</button>
</div>

<div class="card post-form" id="postBox">
    <input id="postTitle" placeholder="帖子标题">
    <textarea id="postContent" placeholder="帖子内容"></textarea>
    <button onclick="sendPost()">发布帖子</button>
</div>

<div class="tip" id="tip"></div>
<div class="loading" id="loading">正在加载数据...</div>
<div id="postList"></div>

<script>
const GIST_ID = "4ed26e3f4e9408013cfc74fcb12ee141";
const GITHUB_TOKEN = "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";
const GIST_API = `https://api.github.com/gists/${GIST_ID}`;

let users = [];
let posts = [];
let currentUser = localStorage.getItem("currentUser") || null;
const ROLE = { user:0, vip:1, admin:2, owner:3 };

// 初始化：先读本地缓存，再拉云端数据
window.onload = async () => {
    // 1. 优先加载本地缓存，防止刷新空白
    let localData = JSON.parse(localStorage.getItem("communityData")) || {users:[], posts:[]};
    users = localData.users;
    posts = localData.posts;
    render();

    // 2. 异步拉取云端最新数据
    await loadCloudData();
    loading.style.display = "none";
    render();
};

// 拉取云端 Gist 数据
async function loadCloudData() {
    try {
        let res = await fetch(GIST_API, {
            headers: {
                "Authorization": `token ${GITHUB_TOKEN}`
            }
        });
        if (!res.ok) throw new Error("请求失败");
        let data = await res.json();
        let raw = data.files["data.json"].content;
        let json = JSON.parse(raw);
        users = json.users || [];
        posts = json.posts || [];
        // 同步到本地缓存
        localStorage.setItem("communityData", JSON.stringify({users, posts}));
    } catch (e) {
        tip.innerText = "⚠️ 云端数据加载失败，显示本地缓存";
    }
}

// 保存数据到云端 + 本地双备份
async function saveAllData() {
    const data = { users, posts };
    // 先存本地（兜底）
    localStorage.setItem("communityData", JSON.stringify(data));
    // 再存云端
    try {
        await fetch(GIST_API, {
            method: "PATCH",
            headers: {
                "Accept": "application/vnd.github.v3+json",
                "Authorization": `token ${GITHUB_TOKEN}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                files: {
                    "data.json": { content: JSON.stringify(data, null, 2) }
                }
            })
        });
    } catch (e) {
        alert("⚠️ 云端保存失败，数据仅保存在当前设备");
    }
}

// 注册
async function register() {
    let u = username.value.trim();
    let p = password.value.trim();
    let a = avatarInput.value.trim() || "";
    if (!u || !p) return alert("请输入用户名和密码");
    if (users.find(x => x.user === u)) return alert("❌ 用户名已存在！");

    let role = u === "liuchenyu" ? "owner" : "user";
    users.push({ user: u, pwd: p, avatar: a, role });
    await saveAllData();
    alert("注册成功！");
    render();
}

// 登录
async function login() {
    let u = username.value.trim();
    let p = password.value.trim();
    let user = users.find(x => x.user === u && x.pwd === p);
    if (!user) return alert("账号或密码错误");

    currentUser = u;
    localStorage.setItem("currentUser", u);
    render();
}

// 退出
function logout() {
    currentUser = null;
    localStorage.removeItem("currentUser");
    render();
}

// 发帖
async function sendPost() {
    if (!currentUser) return;
    let t = postTitle.value.trim();
    let c = postContent.value.trim();
    if (!t || !c) return alert("标题和内容不能为空");

    posts.unshift({
        id: Date.now(),
        user: currentUser,
        title: t,
        content: c,
        time: new Date().toLocaleString()
    });
    postTitle.value = "";
    postContent.value = "";
    await saveAllData();
    render();
}

// 删帖
async function deletePost(id) {
    let post = posts.find(x => x.id === id);
    let me = users.find(x => x.user === currentUser);
    if (!me) return;

    let isOwner = me.role === "owner";
    let isAdmin = me.role === "admin" || isOwner;
    let isAuthor = post.user === currentUser;

    if (!isOwner && !isAdmin && !isAuthor) return alert("你没有权限删除");
    if (!confirm("确定删除该帖子？")) return;

    posts = posts.filter(x => x.id !== id);
    await saveAllData();
    render();
}

// 渲染页面
function render() {
    let me = users.find(x => x.user === currentUser);

    userInfo.innerHTML = currentUser
        ? `<div class="user-row">
             <img class="avatar" src="${me?.avatar||'https://picsum.photos/64/64'}">
             ${currentUser}
             <span class="badge ${me?.role}">${me?.role}</span>
             <button onclick="logout()">退出</button>
           </div>`
        : "未登录";

    loginBox.style.display = currentUser ? "none" : "block";
    postBox.style.display = currentUser ? "block" : "none";
    tip.innerHTML = currentUser ? "" : "⚠️ 未登录只能浏览，不能发帖";

    postList.innerHTML = "";
    posts.forEach(post => {
        let author = users.find(x => x.user === post.user);
        let avatar = author?.avatar || "https://picsum.photos/64/64";
        let role = author?.role || "user";
        let showDel = me && (me.role === "owner" || me.role === "admin" || post.user === currentUser);

        postList.innerHTML += `
        <div class="card">
          ${showDel ? `<button class="danger del-btn" onclick="deletePost(${post.id})">删除</button>` : ""}
          <div class="user-row">
            <img class="avatar" src="${avatar}">
            <div>
              <b>${post.user}</b>
              <span class="badge ${role}">${role}</span>
              <div style="font-size:12px;color:#888">${post.time}</div>
            </div>
          </div>
          <h3 style="margin:10px 0 6px">${post.title}</h3>
          <p style="white-space:pre-wrap">${post.content}</p>
        </div>`;
    });
}
</script>

</body>
</html>
