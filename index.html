<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>YuWebsite 社区</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f2f5f7;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            margin-right: 6px;
            margin-top: 4px;
        }
        button.danger {
            background: #ef4444;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
            vertical-align: middle;
        }
        .user-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .badge {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            margin-left: 8px;
        }
        .user { background: #6b7280; }
        .vip { background: #f59e0b; }
        .admin { background: #10b981; }
        .owner { background: #8b5cf6; }
        .tip {
            color: #666;
            margin: 10px 0;
        }
        .post-form {
            display: none;
        }
        .del-btn {
            float: right;
            transform: translateY(-6px);
        }
        .loading {
            text-align: center;
            color: #3b82f6;
            margin: 20px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>

<header>
    <h1>YuWebsite 社区</h1>
    <div id="userInfo">未登录</div>
</header>

<div class="card" id="loginBox">
    <input id="username" placeholder="用户名（不可重复）">
    <input id="password" placeholder="密码" type="password">
    <input id="avatarInput" placeholder="头像 URL" type="url">
    <button onclick="register()">注册</button>
    <button onclick="login()">登录</button>
</div>

<div class="card post-form" id="postBox">
    <input id="postTitle" placeholder="帖子标题">
    <textarea id="postContent" placeholder="帖子内容"></textarea>
    <button onclick="sendPost()">发布帖子</button>
</div>

<div class="tip" id="tip"></div>
<div class="loading" id="loading">正在加载云端数据...</div>
<div id="postList"></div>

<script>
const BIN_ID = "6a198c4521f9ee59d299a763";
const MASTER_KEY = "$2a$10$B3g5L3BArDbvMO.hIsRpIeVyd5Vd3o/4vXqKQRtRIv4l.ohiVPbMe";

const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
let users = [];
let posts = [];
let currentUser = localStorage.getItem("currentUser") || null;

// 页面初始化
window.onload = async () => {
    await loadData();
    loading.style.display = "none";
    render();
};

// 读取云端数据
async function loadData() {
    try {
        const res = await fetch(API_URL, {
            headers: {
                "X-Master-Key": MASTER_KEY
            }
        });
        const json = await res.json();
        users = json.record.users || [];
        posts = json.record.posts || [];
        localStorage.setItem("cache_data", JSON.stringify(json.record));
    } catch (e) {
        tip.innerText = "⚠️ 云端加载失败，显示本地缓存";
        const cache = JSON.parse(localStorage.getItem("cache_data")) || {users:[], posts:[]};
        users = cache.users;
        posts = cache.posts;
    }
}

// 保存数据到云端
async function saveData() {
    const data = { users, posts };
    localStorage.setItem("cache_data", JSON.stringify(data));
    try {
        await fetch(API_URL, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "X-Master-Key": MASTER_KEY
            },
            body: JSON.stringify(data)
        });
        return true;
    } catch (e) {
        tip.innerText = "❌ 云端保存失败";
        return false;
    }
}

// 注册账号（防重名 + liuchenyu 自动管理者）
async function register() {
    const u = username.value.trim();
    const p = password.value.trim();
    const a = avatarInput.value.trim() || "";
    if (!u || !p) return alert("请填写用户名和密码");
    if (users.find(item => item.user === u)) return alert("用户名已存在！");

    const role = u === "liuchenyu" ? "owner" : "user";
    users.push({ user: u, pwd: p, avatar: a, role });
    await saveData();
    alert("注册成功！");
    render();
}

// 登录
async function login() {
    const u = username.value.trim();
    const p = password.value.trim();
    const user = users.find(item => item.user === u && item.pwd === p);
    if (!user) return alert("账号或密码错误");

    currentUser = u;
    localStorage.setItem("currentUser", u);
    render();
}

// 退出登录
function logout() {
    currentUser = null;
    localStorage.removeItem("currentUser");
    render();
}

// 发布帖子
async function sendPost() {
    if (!currentUser) return;
    const t = postTitle.value.trim();
    const c = postContent.value.trim();
    if (!t || !c) return alert("标题和内容不能为空");

    posts.unshift({
        id: Date.now(),
        user: currentUser,
        title: t,
        content: c,
        time: new Date().toLocaleString()
    });
    postTitle.value = "";
    postContent.value = "";
    const ok = await saveData();
    if(ok) tip.innerText = "✅ 发布成功，所有人可见";
    render();
}

// 删除帖子（权限控制）
async function deletePost(id) {
    const post = posts.find(item => item.id === id);
    const me = users.find(item => item.user === currentUser);
    if (!me) return;

    const isOwner = me.role === "owner";
    const isAdmin = me.role === "admin" || isOwner;
    const isAuthor = post.user === currentUser;

    if (!isOwner && !isAdmin && !isAuthor) return alert("你没有删除权限");
    if (!confirm("确定删除该帖子？")) return;

    posts = posts.filter(item => item.id !== id);
    await saveData();
    render();
}

// 渲染页面
function render() {
    const me = users.find(item => item.user === currentUser);

    userInfo.innerHTML = currentUser
        ? `<div class="user-row">
             <img class="avatar" src="${me?.avatar||'https://picsum.photos/64/64'}">
             ${currentUser}
             <span class="badge ${me?.role}">${me?.role}</span>
             <button onclick="logout()">退出</button>
           </div>`
        : "未登录";

    loginBox.style.display = currentUser ? "none" : "block";
    postBox.style.display = currentUser ? "block" : "none";

    postList.innerHTML = "";
    posts.forEach(post => {
        const author = users.find(item => item.user === post.user);
        const avatar = author?.avatar || "https://picsum.photos/64/64";
        const role = author?.role || "user";
        const showDel = me && (me.role === "owner" || me.role === "admin" || post.user === currentUser);

        postList.innerHTML += `
        <div class="card">
          ${showDel ? `<button class="danger del-btn" onclick="deletePost(${post.id})">删除</button>` : ""}
          <div class="user-row">
            <img class="avatar" src="${avatar}">
            <div>
              <b>${post.user}</b>
              <span class="badge ${role}">${role}</span>
              <div style="font-size:12px;color:#888">${post.time}</div>
            </div>
          </div>
          <h3 style="margin:10px 0 6px">${post.title}</h3>
          <p style="white-space:pre-wrap">${post.content}</p>
        </div>`;
    });
}
</script>

</body>
</html>
