<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>YuWebsite 社区</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f2f5f7;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            margin-right: 6px;
            margin-top: 4px;
        }
        button.danger {
            background: #ef4444;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
            vertical-align: middle;
        }
        .user-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .badge {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            margin-left: 8px;
        }
        .user { background: #6b7280; }
        .vip { background: #f59e0b; }
        .admin { background: #10b981; }
        .owner { background: #8b5cf6; }
        .tip {
            color: #666;
            margin: 10px 0;
        }
        .post-form {
            display: none;
        }
        .del-btn {
            float: right;
            transform: translateY(-6px);
        }
        .loading {
            text-align: center;
            color: #3b82f6;
            margin: 20px 0;
            font-size: 16px;
        }
        .like {
            color: #f43f5e;
            cursor: pointer;
            margin-right: 10px;
        }
        .comment {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        .reply {
            padding-left: 30px;
            font-size: 14px;
            color: #555;
        }
        .pinned {
            border: 1px solid #8b5cf6;
            background: #faf5ff;
        }
        .global-pin {
            background: #fff7e6;
            border: 1px solid #f59e0b;
        }
        .notify {
            color: #ef4444;
            font-weight: bold;
        }
        .pill {
            background: #eee;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .message-box {
            max-height: 300px;
            overflow-y: auto;
            margin: 10px 0;
        }
        .msg-me {
            text-align: right;
            background: #dbeafe;
            padding: 6px 10px;
            border-radius: 10px;
            margin: 4px 0;
        }
        .msg-other {
            text-align: left;
            background: #f3f4f6;
            padding: 6px 10px;
            border-radius: 10px;
            margin: 4px 0;
        }
    </style>
</head>
<body>

<header>
    <h1>YuWebsite 社区</h1>
    <div id="userInfo">未登录</div>
</header>

<div class="card" id="loginBox">
    <input id="username" placeholder="用户名（不可重复）">
    <input id="password" placeholder="密码" type="password">
    <input id="avatarInput" placeholder="头像 URL" type="url">
    <button onclick="register()">注册</button>
    <button onclick="login()">登录</button>
</div>

<div class="card post-form" id="postBox">
    <input id="postTitle" placeholder="帖子标题">
    <textarea id="postContent" placeholder="帖子内容"></textarea>
    <button onclick="sendPost()">发布帖子</button>
    <button onclick="showAnnounce()">📢 管理者推送</button>
    <button onclick="showInbox()">📥 消息(<span id="msgCount">0</span>)</button>
</div>

<div class="tip" id="tip"></div>
<div class="loading" id="loading">正在加载云端数据...</div>
<div id="postList"></div>

<script>
const BIN_ID = "6a198c4521f9ee59d299a763";
const MASTER_KEY = "$2a$10$B3g5L3BArDbvMO.hIsRpIeVyd5Vd3o/4vXqKQRtRIv4l.ohiVPbMe";
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

let users = [];
let posts = [];
let comments = [];
let likes = [];
let messages = [];
let follows = [];
let currentUser = localStorage.getItem("currentUser") || null;

window.onload = async () => {
    await loadData();
    loading.style.display = "none";
    render();
};

async function loadData() {
    try {
        let res = await fetch(API_URL, { headers: { "X-Master-Key": MASTER_KEY } });
        let json = await res.json();
        let d = json.record;
        users = d.users || [];
        posts = d.posts || [];
        comments = d.comments || [];
        likes = d.likes || [];
        messages = d.messages || [];
        follows = d.follows || [];
    } catch (e) {
        let local = JSON.parse(localStorage.getItem("data")) || { users: [], posts: [], comments: [], likes: [], messages: [], follows: [] };
        users = local.users;
        posts = local.posts;
        comments = local.comments;
        likes = local.likes;
        messages = local.messages;
        follows = local.follows;
    }
}

async function save() {
    let data = { users, posts, comments, likes, messages, follows };
    localStorage.setItem("data", JSON.stringify(data));
    await fetch(API_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
        body: JSON.stringify(data)
    });
    render();
}

function register() {
    let u = username.value.trim();
    let p = password.value.trim();
    let a = avatarInput.value.trim();
    if (!u || !p) return alert("请输入账号密码");
    if (users.find(x => x.user === u)) return alert("用户名已存在");
    users.push({ user: u, pwd: p, avatar: a, role: u === "liuchenyu" ? "owner" : "user" });
    save();
    alert("注册成功");
}

function login() {
    let u = username.value.trim();
    let p = password.value.trim();
    let user = users.find(x => x.user === u && x.pwd === p);
    if (!user) return alert("账号或密码错误");
    currentUser = u;
    localStorage.setItem("currentUser", u);
    render();
}

function logout() {
    currentUser = null;
    localStorage.removeItem("currentUser");
    render();
}

function sendPost() {
    if (!currentUser) return;
    let t = postTitle.value.trim();
    let c = postContent.value.trim();
    if (!t || !c) return;
    posts.unshift({ id: Date.now(), user: currentUser, title: t, content: c, time: new Date().toLocaleString(), pin: 0 });
    postTitle.value = "";
    postContent.value = "";
    save();
}

function likePost(pid) {
    if (!currentUser) return;
    if (likes.find(x => x.pid === pid && x.user === currentUser)) return alert("已点赞");
    likes.push({ pid, user: currentUser });
    save();
}

function addComment(pid) {
    let txt = prompt("输入评论：");
    if (!txt) return;
    comments.push({ id: Date.now(), pid, user: currentUser, content: txt, time: new Date().toLocaleString(), pin: 0 });
    save();
}

function replyComment(cid) {
    let txt = prompt("回复：");
    if (!txt) return;
    comments.push({ id: Date.now(), pid: 0, replyTo: cid, user: currentUser, content: txt, time: new Date().toLocaleString() });
    save();
}

function pinComment(cid) {
    let c = comments.find(x => x.id === cid);
    c.pin = 1;
    save();
}

function follow(user) {
    if (user === currentUser) return;
    if (follows.find(x => x.from === currentUser && x.to === user)) return alert("已关注");
    follows.push({ from: currentUser, to: user });
    save();
}

function sendMessage(to) {
    let txt = prompt("输入私信：");
    if (!txt) return;
    messages.push({ from: currentUser, to, content: txt, time: new Date().toLocaleString(), read: 0 });
    save();
}

function showInbox() {
    let myMsg = messages.filter(x => x.to === currentUser);
    let s = "";
    myMsg.forEach(m => {
        s += `<div class="${m.read ? 'msg-other' : 'msg-other notify'}">${m.from}: ${m.content}<br><small>${m.time}</small></div>`;
        m.read = 1;
    });
    save();
    alert("私信\n\n" + s);
}

function pinPost(pid) {
    posts.forEach(p => p.pin = 0);
    posts.find(p => p.id === pid).pin = 1;
    save();
}

function showAnnounce() {
    if (currentUser !== "liuchenyu") return alert("无权限");
    let txt = prompt("输入全站推送内容：");
    if (!txt) return;
    messages.push({ from: "系统", to: "all", content: txt, time: new Date().toLocaleString() });
    save();
}

function deletePost(id) {
    let p = posts.find(x => x.id === id);
    let me = users.find(x => x.user === currentUser);
    if (!me) return;
    let ok = me.role === "owner" || me.role === "admin" || p.user === currentUser;
    if (!ok) return alert("无权限");
    if (!confirm("确定删除？")) return;
    posts = posts.filter(x => x.id !== id);
    save();
}

function render() {
    let me = users.find(x => x.user === currentUser);
    let msgCount = messages.filter(x => x.to === currentUser && !x.read).length;
    msgCount.innerHTML = msgCount;

    userInfo.innerHTML = currentUser
        ? `<div class="user-row"><img class="avatar" src="${me?.avatar||'https://picsum.photos/64/64'}">${currentUser}<span class="badge ${me.role}">${me.role}</span><button onclick="logout()">退出</button></div>`
        : "未登录";

    loginBox.style.display = currentUser ? "none" : "block";
    postBox.style.display = currentUser ? "block" : "none";

    postList.innerHTML = "";
    posts.sort((a, b) => b.pin - a.pin).forEach(p => {
        let myLike = likes.find(x => x.pid === p.id && x.user === currentUser);
        let cmt = comments.filter(x => x.pid === p.id);
        let pinBtn = (me?.role === "owner" || me?.role === "admin") ? `<button onclick="pinPost(${p.id})">置顶</button>` : "";

        postList.innerHTML += `
        <div class="card ${p.pin ? 'global-pin' : ''}">
            <button class="danger del-btn" onclick="deletePost(${p.id})">删除</button>
            ${pinBtn}
            <div class="user-row">
                <img class="avatar" src="${users.find(u=>u.user===p.user)?.avatar||'https://picsum.photos/64/64'}">
                <div>
                    <b>${p.user}</b>
                    <span class="badge ${users.find(u=>u.user===p.user)?.role||'user'}">${users.find(u=>u.user===p.user)?.role||'user'}</span>
                    <div style="font-size:12px;color:#888">${p.time}</div>
                </div>
                <button class="pill" onclick="follow('${p.user}')">关注</button>
                <button class="pill" onclick="sendMessage('${p.user}')">私信</button>
            </div>
            <h3>${p.title}</h3>
            <p>${p.content}</p>
            <div style="margin-top:10px">
                <span class="like" onclick="likePost(${p.id})">❤️ ${likes.filter(x=>x.pid===p.id).length}</span>
                <button onclick="addComment(${p.id})">评论</button>
            </div>
            <div class="comments">
                ${cmt.sort((a,b)=>b.pin-a.pin).map(c => `
                <div class="comment ${c.pin?'pinned':''}">
                    <b>${c.user}</b> ${c.pin?'[置顶]':''}<br>${c.content}<br>
                    <small>${c.time}</small>
                    <button onclick="replyComment(${c.id})">回复</button>
                    ${me?.role==='owner'||me?.role==='admin'?`<button onclick="pinComment(${c.id})">顶置评论</button>`:''}
                </div>
                <div class="reply">
                    ${comments.filter(r=>r.replyTo===c.id).map(r=>`
                    <div><b>${r.user}</b>: ${r.content}<br><small>${r.time}</small></div>
                    `).join('')}
                </div>
                `).join('')}
            </div>
        </div>`;
    });
}
</script>
</body>
</html>
